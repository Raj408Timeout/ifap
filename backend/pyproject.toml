[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ifap"
version = "0.1.0"
description = "Intelligent Feedback & Assessment Platform - AI questionnaire generation"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "chromadb>=0.5",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "mcp>=2.3",
]

[project.scripts]
ifap-mcp = "ifap.mcp_server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "black>=24.10",
    "pylint>=3.3",
]

# Third-party agents register here - no change to IFAP required:
# [project.entry-points."ifap.agents"]
# sentiment = "my_company_agents.sentiment"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ifap = ["py.typed"]

# ---------------------------------------------------------------- formatting / lint
[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C90", "RUF", "ASYNC", "PL", "PT", "TC", "ANN", "S"]
ignore = [
    "TC001", "TC002", "TC003",  # runtime imports needed by Pydantic/FastAPI
    "PLR0913",                  # keyword-only DI constructors are explicit by design
    "TC006",                    # unquoted cast() types read better and pylint understands them
]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN"]
"scripts/**" = ["E501", "T201"]

[tool.pylint.main]
py-version = "3.13"
load-plugins = []
ignore-paths = ["^scripts/.*"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 6
max-attributes = 10
max-returns = 4
min-public-methods = 0

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",   # value objects & ports
    "duplicate-code",           # agent constructors share DI boilerplate by design
]

# ---------------------------------------------------------------- typing
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = ["integration: touches real infrastructure (Chroma, DB, HTTP app)"]

[tool.coverage.run]
source = ["src/ifap"]
branch = true
# Only genuinely untestable code is omitted - never add a file here to "fix" coverage.
omit = [
    "src/ifap/main.py",  # 2-line ASGI entry point (`app = create_app()`), exercised by `make api`
    "src/ifap/mcp_server/__main__.py",  # 2-line `python -m` entry point; logic is in cli.py
]

[tool.coverage.report]
fail_under = 100        # line + branch; CI and `make check` fail below this
show_missing = true
skip_covered = true
